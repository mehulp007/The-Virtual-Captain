name: T20
scheduled_balls: 120

# Phases are keyed on legal balls already bowled in the innings.
# Each entry ends the phase once that many balls have gone (null = rest of innings).
phases:
  - {name: powerplay, until: 36}
  - {name: middle, until: 90}
  - {name: death, until: null}

# The Hundred is stored as T20 in the source data but uses 5-ball overs and 100 balls.
variants:
  five_ball:
    scheduled_balls: 100
    phases:
      - {name: powerplay, until: 25}
      - {name: middle, until: 75}
      - {name: death, until: null}
